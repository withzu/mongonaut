name: Build & publish Docker image

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get commit author info
        id: author
        run: |
          AUTHOR_NAME=$(git log -1 --format='%an' ${{ github.sha }})
          AUTHOR_EMAIL=$(git log -1 --format='%ae' ${{ github.sha }})
          echo "name=$AUTHOR_NAME" >> $GITHUB_OUTPUT
          echo "email=$AUTHOR_EMAIL" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ steps.extract_version.outputs.VERSION }}"/' package.json

      - name: Commit package.json changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --local user.email "${{ steps.author.outputs.email }}"
          git config --local user.name "${{ steps.author.outputs.name }}"
          git add package.json
          # A release commit usually bumps the version already. Without this
          # guard `git commit` exits 1 on an unchanged tree and the whole
          # publish job aborts before the image is ever built.
          if git diff --staged --quiet; then
            echo "package.json already at ${{ steps.extract_version.outputs.VERSION }}, nothing to commit"
          else
            git commit -m "chore: update version to ${{ steps.extract_version.outputs.VERSION }}"
            # Push to the actual default branch instead of a hardcoded name.
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      #- name: Log in to Docker Hub
      #  uses: docker/login-action@v3
      #  with:
      #    username: ${{ secrets.DOCKERHUB_USERNAME }}
      #    password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
      #      ${{ secrets.DOCKERHUB_USERNAME }}/mongonaut
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # A prerelease tag carries a hyphen and must not move "latest".
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Mongonaut
            org.opencontainers.image.description=A modern, open source MongoDB web interface built for self hosted environments.
            org.opencontainers.image.url=https://mongonaut.org
            org.opencontainers.image.documentation=https://mongonaut.org
            org.opencontainers.image.vendor=The Zu Company
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # A signed build record and a component list, so an operator can see
          # what is inside the image before running it against their database.
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: |
            type=gha,scope=amd64,mode=max
            type=gha,scope=arm64,mode=max
          parallel: true